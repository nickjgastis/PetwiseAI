<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Consultation: Bella</title>
        <!-- A neutral, made-up practice software screen for Chrome Web Store screenshots (npm run screenshots). -->
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                font: 14px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                color: #1f2a37;
                background: #f3f5f8;
                display: grid;
                grid-template-columns: 210px 1fr;
                min-height: 100vh;
            }
            aside {
                background: #1f2d3d;
                color: #c9d3df;
                padding: 18px 14px;
            }
            .clinic {
                display: flex;
                align-items: center;
                gap: 10px;
                color: #fff;
                font-weight: 700;
                font-size: 14px;
                margin-bottom: 26px;
            }
            .clinic i {
                width: 30px;
                height: 30px;
                border-radius: 8px;
                background: #3aa58a;
                display: grid;
                place-items: center;
                font-style: normal;
            }
            aside a {
                display: block;
                padding: 8px 10px;
                border-radius: 7px;
                color: inherit;
                text-decoration: none;
                margin-bottom: 2px;
            }
            aside a.on {
                background: #2e4157;
                color: #fff;
            }
            main {
                padding: 22px 28px;
            }
            .patient {
                display: flex;
                align-items: center;
                gap: 14px;
                background: #fff;
                border: 1px solid #e1e6ec;
                border-radius: 12px;
                padding: 14px 18px;
            }
            .avatar {
                width: 42px;
                height: 42px;
                border-radius: 50%;
                background: #f1e3c8;
                display: grid;
                place-items: center;
                font-weight: 700;
                color: #8a6a2f;
            }
            .patient h1 {
                margin: 0;
                font-size: 18px;
            }
            .patient p {
                margin: 0;
                color: #6b7785;
                font-size: 13px;
            }
            .patient .badge {
                margin-left: auto;
                font-size: 12px;
                font-weight: 600;
                color: #2f6f5c;
                background: #e3f4ee;
                padding: 5px 10px;
                border-radius: 999px;
            }
            .tabs {
                display: flex;
                gap: 22px;
                margin: 18px 4px 14px;
                font-weight: 600;
                color: #6b7785;
            }
            .tabs span.on {
                color: #1f2a37;
                box-shadow: inset 0 -2px #3aa58a;
                padding-bottom: 6px;
            }
            .card {
                background: #fff;
                border: 1px solid #e1e6ec;
                border-radius: 12px;
                padding: 18px;
            }
            .grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 16px 18px;
            }
            label {
                display: block;
                font-size: 12px;
                font-weight: 700;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                color: #4b5867;
                margin-bottom: 6px;
            }
            textarea {
                width: 100%;
                height: 150px;
                resize: none;
                padding: 10px 12px;
                border: 1px solid #cfd7e0;
                border-radius: 8px;
                font: 13px/1.5 inherit;
                font-family: inherit;
                color: #1f2a37;
                background: #fbfcfd;
            }
            textarea:focus {
                outline: none;
                border-color: #3aa58a;
                box-shadow: 0 0 0 3px rgba(58, 165, 138, 0.18);
                background: #fff;
            }
        </style>
    </head>
    <body>
        <aside>
            <div class="clinic"><i>N</i> Northside Animal Hospital</div>
            <a href="#">Schedule</a>
            <a href="#" class="on">Patients</a>
            <a href="#">Treatments</a>
            <a href="#">Invoices</a>
            <a href="#">Reports</a>
        </aside>
        <main>
            <section class="patient">
                <span class="avatar">B</span>
                <div>
                    <h1>Bella</h1>
                    <p>Canine · Labrador Retriever · 6y FS · 24.2 kg</p>
                </div>
                <span class="badge">In consult</span>
            </section>
            <nav class="tabs"><span class="on">Clinical notes</span><span>Vitals</span><span>Medications</span><span>Billing</span></nav>
            <section class="card grid">
                <div>
                    <label for="subjective">Subjective</label>
                    <textarea id="subjective"></textarea>
                </div>
                <div>
                    <label for="objective">Objective</label>
                    <textarea id="objective"></textarea>
                </div>
                <div>
                    <label for="assessment">Assessment</label>
                    <textarea id="assessment"></textarea>
                </div>
                <div>
                    <label for="plan">Plan</label>
                    <textarea id="plan"></textarea>
                </div>
            </section>
        </main>
    </body>
</html>
