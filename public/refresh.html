<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#3369bd" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Update Petwise</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Inter, Helvetica, system-ui, sans-serif;
      background: #3369bd;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-top: calc(24px + env(safe-area-inset-top));
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }
    .card { text-align: center; max-width: 320px; width: 100%; }
    img {
      width: 88px; height: 88px; border-radius: 20px;
      margin: 0 auto 24px; display: block;
      box-shadow: 0 8px 32px rgba(0,0,0,.2);
    }
    h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: .03em; }
    p { color: rgba(255,255,255,.8); font-size: 16px; line-height: 1.45; margin: 0 0 32px; }
    button {
      width: 100%; padding: 16px 24px; border: none; border-radius: 12px;
      background: #fff; color: #3369bd; font-size: 17px; font-weight: 600; cursor: pointer;
    }
    .status { font-size: 14px; color: rgba(255,255,255,.7); margin-top: 16px; min-height: 1.4em; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/apple-touch-icon.png" alt="Petwise" />
    <h1>Update Petwise</h1>
    <p>Clearing the saved copy of the app so you get the latest version.</p>
    <button type="button" id="reload">Reload app</button>
    <div class="status" id="status">Updating…</div>
  </div>
  <script>
    async function purge() {
      const status = document.getElementById('status');
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.unregister()));
        }
        if (window.caches) {
          const keys = await caches.keys();
          await Promise.all(keys.map((k) => caches.delete(k)));
        }
        status.textContent = 'Done. Reloading…';
      } catch (err) {
        status.textContent = 'Couldn’t clear automatically — tap Reload app.';
        throw err;
      }
    }

    function go() {
      window.location.replace('/?updated=' + Date.now());
    }

    document.getElementById('reload').addEventListener('click', function () {
      purge().finally(go);
    });

    purge().then(go).catch(function () {});
  </script>
</body>
</html>
