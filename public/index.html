  <meta charset="utf-8" />
  <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" />

  <meta name="theme-color" content="#ffffff" />
  <link rel="preload" href="%PUBLIC_URL%/fonts/Geist-Variable-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="%PUBLIC_URL%/fonts/InterVariable-latin.woff2" as="font" type="font/woff2" crossorigin />
  <!-- Self-hosted full builds: Google Fonts strips the alternates (Geist ss03/ss05, Inter cv05/cv08). Lives here, not in CSS, so webpack doesn't try to bundle them. -->
  <style>
    @font-face {
      font-family: 'Geist';
      src: url('%PUBLIC_URL%/fonts/Geist-Variable-latin.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Inter';
      src: url('%PUBLIC_URL%/fonts/InterVariable-latin.woff2') format('woff2');
      font-weight: 300 900;
      font-style: normal;
      font-display: swap;
    }
    #pw-rotate { display: none; }
    .pw-sideways body { overflow: hidden; }
    .pw-sideways #pw-rotate {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      position: fixed; inset: 0; z-index: 2147483647; padding: 24px; text-align: center;
      background: linear-gradient(180deg, #f3f7fd, #ffffff); color: #13233f;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #pw-rotate svg { width: 44px; height: 44px; color: #2d5fb8; }
    #pw-rotate p { margin: 0; font-size: 18px; font-weight: 600; }
    #pw-rotate span { font-size: 14px; color: rgba(26, 43, 74, 0.6); }
  </style>
  <meta name="description" content="PetWise is the veterinary AI scribe built by a veterinarian. Get finished SOAP notes in seconds." />
  
  <!-- Android detection - runs immediately to prevent flash -->
  <script>
    document.documentElement.classList.add('js-reveal');
    if (/Android/i.test(navigator.userAgent)) {
      document.documentElement.classList.add('android');
    }
    // Phones are portrait only. iOS ignores the manifest orientation, so cover the page when sideways.
    // Uses the device orientation, not the viewport, so an Android keyboard shrinking the viewport doesn't trigger it.
    (function () {
      var html = document.documentElement;
      function check() {
        var phone = Math.min(screen.width, screen.height) < 500 && window.matchMedia('(pointer: coarse)').matches;
        var type = screen.orientation && screen.orientation.type;
        var sideways = type ? type.indexOf('landscape') === 0 : Math.abs(window.orientation || 0) === 90;
        html.classList.toggle('pw-sideways', phone && sideways);
      }
      check();
      if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', check);
      window.addEventListener('orientationchange', check);
      window.addEventListener('resize', check);
      try { screen.orientation.lock('portrait').catch(function () {}); } catch (e) {}
    })();
    // Capture beforeinstallprompt early - before React loads
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.deferredInstallPrompt = e;
    });
  </script>
  
  <!-- PWA / iOS -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PetWise" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
  
  <!-- Manifest -->

  <title>PetWise</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="pw-rotate" aria-live="polite">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2.5" /><line x1="11" y1="18" x2="13" y2="18" /></svg>
    <p>Turn your phone upright</p>
    <span>PetWise works in portrait.</span>
  </div>
  <div id="root"></div>
  <script>
    // Prerendered marketing HTML is also the SPA fallback for app routes, so
    // drop it when it doesn't belong to this URL (or "/" is the app entry).
    (function () {
      var root = document.getElementById('root');
      var page = root && root.getAttribute('data-prerendered');
      if (!page) return;
      var path = location.pathname.replace(/\/+$/, '') || '/';
      var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
      var appHost = location.hostname.indexOf('app.') === 0;
      if (path !== page || (page === '/' && (standalone || appHost))) {
        root.innerHTML = '';
        root.removeAttribute('data-prerendered');
        document.querySelectorAll('[data-seo]').forEach(function (el) { el.remove(); });
        document.title = 'PetWise';
      }
    })();
  </script>
</body>

</html>
